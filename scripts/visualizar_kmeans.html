<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniGestor BD2 · Aprendizaje del K-Means</title>
<style>
/* Mismos tokens y piezas que frontend/src/styles.css (topbar, panel, toolbar, tabbar, grid-table). */
:root {
  --bg: #dce9f2;
  --panel: #ffffff;
  --header: #cfe6f7;
  --toolbar: #eaf5fd;
  --border: #9cc2dc;
  --border-light: #cadeec;
  --text: #21323d;
  --muted: #5c7280;
  --accent: #1a7fbf;
  --accent-dark: #14688f;
  --sel: #cdeafc;
  --gridhead: #ddf0fb;
  --other: #c3cdd4;
  /* Paleta categórica validada (orden fijo) para las 8 palabras resaltadas y los géneros. */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --mono: "Consolas", "Courier New", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; font-size: 12px; background: var(--bg); color: var(--text); }
.app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--accent); border-bottom: 1px solid var(--accent-dark); color: #fff; }
.topbar h1 { font-size: 13px; font-weight: 600; margin: 0; }
.topbar .db { color: #dceffb; font-size: 11px; }
.layout { flex: 1; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 1px; background: var(--border); }
.workarea { display: grid; grid-template-rows: auto auto 1fr; gap: 1px; background: var(--border); min-width: 0; }
.bottom { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1px; background: var(--border); }
.panel { background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
.panel h2 { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; margin: 0; padding: 4px 8px; background: var(--header); border-bottom: 1px solid var(--border); }
.panel h2 .nota { font-weight: 400; color: var(--muted); margin-left: auto; }
.panel-body { padding: 6px 8px; min-width: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 11px; }
.idx-title { margin: 8px 0 2px; font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; }
.idx-title:first-child { margin-top: 2px; }
.col-row { display: flex; justify-content: space-between; gap: 8px; padding: 1px 4px; }
.col-row .type { color: var(--muted); font-family: var(--mono); font-size: 11px; text-align: right; overflow-wrap: anywhere; }
.ruta { font-family: var(--mono); font-size: 10px; color: var(--muted); padding: 1px 4px; overflow-wrap: anywhere; }
.tree-head { width: 100%; display: flex; align-items: center; gap: 6px; text-align: left; background: none; border: 1px solid transparent; color: var(--text); cursor: pointer; padding: 2px 4px; font: inherit; }
.tree-head:hover, .tree-head:focus-visible { background: var(--sel); }
.tree-head[aria-pressed="true"] { background: var(--sel); border-color: var(--border); }
.tree-head .pct { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.node-icon { display: inline-block; width: 11px; height: 11px; border: 1px solid rgb(0 0 0 / 0.25); flex: none; }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 3px 6px; background: var(--toolbar); border-bottom: 1px solid var(--border-light); flex-wrap: wrap; }
.toolbar .lbl { color: var(--muted); font-size: 11px; font-family: var(--mono); }
.toolbar input[type=range] { flex: 1 1 200px; accent-color: var(--accent); }
.btn { background: var(--accent); border: 1px solid var(--accent-dark); color: #fff; padding: 2px 12px; font: 600 12px inherit; font-family: inherit; cursor: pointer; border-radius: 2px; }
.btn:hover { background: var(--accent-dark); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.status { border-top: 1px solid var(--border-light); background: var(--toolbar); padding: 2px 8px; font-size: 11px; color: var(--muted); }
.stack { display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
.tabbar { display: flex; gap: 2px; padding: 3px 6px 0; background: var(--toolbar); border-bottom: 1px solid var(--border); }
.tab { border: 1px solid var(--border); border-bottom: none; background: var(--panel); color: var(--text); font: inherit; font-size: 11px; padding: 1px 8px; cursor: pointer; }
.tab.active { background: var(--accent); border-color: var(--accent-dark); color: #fff; }
.curvas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.vistas, .pareja { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
figure { margin: 0; min-width: 0; border: 1px solid var(--border-light); }
figcaption { font-size: 11px; font-weight: 600; padding: 3px 6px; background: var(--gridhead); border-bottom: 1px solid var(--border-light); }
.chart { position: relative; min-width: 0; padding: 4px; }
.chart svg, .chart canvas { display: block; max-width: 100%; }
.grid-table { border-collapse: collapse; font-size: 12px; width: 100%; }
.grid-table th, .grid-table td { border: 1px solid var(--border-light); padding: 2px 8px; text-align: left; white-space: nowrap; }
.grid-table thead th { background: var(--gridhead); font-weight: 600; }
.grid-table td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.grid-table td.txt { font-family: inherit; }
.tabla { overflow-x: auto; }
.ex-bar { height: 6px; background: var(--border-light); min-width: 80px; }
.ex-bar > div { height: 100%; }
.ex-text { margin: 0; font-family: var(--mono); font-size: 11px; white-space: pre; overflow: auto; max-height: 340px; }
.lectura p { margin: 0 0 8px; line-height: 1.45; }
.tip { position: fixed; z-index: 20; pointer-events: none; max-width: 260px; padding: 4px 8px; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); box-shadow: 0 2px 8px rgb(33 50 61 / 0.18); font-size: 11px; line-height: 1.4; }
.vacio { padding: 16px; }
@media (max-width: 1100px) { .curvas { grid-template-columns: repeat(2, minmax(0, 1fr)); } .bottom { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 800px) {
  .topbar { flex-wrap: wrap; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .vistas, .pareja { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 480px) { .curvas { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>MiniGestor BD2</h1>
    <span class="db" id="db">— análisis: aprendizaje del K-Means</span>
  </header>
  <div class="layout" id="layout">
    <aside class="panel"><h2>Entrenamiento</h2><div class="panel-body" id="lateral"></div></aside>
    <div class="workarea">
      <section class="panel">
        <h2>Convergencia <span class="nota">clic en una curva: ir a esa iteración</span></h2>
        <div class="panel-body"><div class="curvas" id="curvas"></div></div>
      </section>
      <section class="panel">
        <h2>Entrenamiento iteración por iteración</h2>
        <div class="toolbar">
          <button class="btn" id="play" type="button">▶ Reproducir</button>
          <input type="range" id="iteracion" min="0" max="0" step="1" value="0" aria-label="Iteración">
          <span class="lbl" id="readout"></span>
        </div>
        <div class="panel-body">
          <div class="vistas">
            <figure><figcaption>Proyección t-SNE fija (Rauber T1)</figcaption><div class="chart" id="tsne"></div></figure>
            <figure><figcaption id="pca-titulo">Trayectorias de los centroides en PCA (Rauber T2)</figcaption><div class="chart" id="pca"></div></figure>
          </div>
        </div>
        <div class="status" id="estado"></div>
      </section>
      <div class="bottom">
        <div class="stack">
          <div class="tabbar" role="tablist">
            <button class="tab active" type="button" role="tab" data-tab="tamanos">Tamaños</button>
            <button class="tab" type="button" role="tab" data-tab="sustituto">Sustituto</button>
            <button class="tab" type="button" role="tab" data-tab="generos">Géneros</button>
          </div>
          <section class="panel" id="tab-tamanos"><div class="panel-body"></div></section>
          <section class="panel" id="tab-sustituto" hidden><div class="panel-body"></div></section>
          <section class="panel" id="tab-generos" hidden><div class="panel-body"></div></section>
        </div>
        <section class="panel"><h2>Cómo leerlo</h2><div class="panel-body lectura" id="lectura"></div></section>
      </div>
    </div>
  </div>
</div>
<div class="tip" id="tip" role="status" hidden></div>

<script id="datos" type="application/json">null</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(() => {
const D = JSON.parse(document.getElementById("datos").textContent);
if (!D) {
  document.getElementById("layout").innerHTML = '<section class="panel vacio"><h2>Sin datos</h2><div class="panel-body">Esta es la plantilla. ' +
    'Genera la página de un entrenamiento con <span class="mono">python scripts/visualizar_kmeans.py --run &lt;carpeta&gt;</span>.</div></section>';
  return;
}
const $ = id => document.getElementById(id);
const M = D.meta, T = M.iterations + 1, K = M.k, top = D.top, hist = D.history, P = D.proj, N = P.x.length;
const fmt = { int: d3.format(","), pct: d3.format(".1%"), pct2: d3.format(".2%"), num: d3.format(".4~g"), f2: d3.format(".2f"),
              sci: v => v === 0 ? "0" : d3.format(".3~e")(v) };
const iterName = t => t === 0 ? "K-Means++" : `iteración ${t}`;
const esc = s => String(s).replace(/[&<>]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[ch]);
const slotOf = new Map(top.map((c, s) => [c, s]));
const state = { t: T - 1, hl: null, locked: null, tab: "tamanos" };
const onT = [], redraws = [];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { text: css("--text"), muted: css("--muted"), grid: css("--border-light"), panel: css("--panel"), accent: css("--accent"),
            other: css("--other"), series: [1, 2, 3, 4, 5, 6, 7, 8].map(i => css(`--s${i}`)) };
const source = M.extractor === "external-npy" ? `descriptores ${M.descriptor_id}` : M.extractor.toUpperCase();
$("db").textContent = `— análisis: aprendizaje del K-Means · vocabulario de ${source}`;
document.title = `MiniGestor BD2 · K-Means ${source}`;

/* ---------- tooltip ---------- */
const tip = $("tip");
function showTip(html, ev) {
  tip.innerHTML = html; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > innerHeight - 8) y = ev.clientY - h - 14;
  tip.style.left = `${Math.max(8, x)}px`; tip.style.top = `${Math.max(8, y)}px`;
}
const hideTip = () => { tip.hidden = true; };
const el = (tag, attrs = {}, html = "") => Object.assign(document.createElement(tag), attrs, html ? { innerHTML: html } : {});
function figure(parent, title) {
  const f = el("figure"), host = el("div", { className: "chart" });
  f.append(el("figcaption", {}, title), host); parent.append(f);
  return host;
}
const total = d3.sum(D.sizes);

/* ---------- panel lateral ---------- */
const side = $("lateral");
const rows = (pairs) => pairs.map(([k, v]) => `<div class="col-row"><span>${k}</span><span class="type">${v}</span></div>`).join("");
side.innerHTML =
  `<div class="idx-title">Ejecución</div>` + rows([["Palabras (K)", fmt.int(K)], ["Dimensiones", M.d], ["Muestra", fmt.int(M.sample)],
    ["Iteraciones", M.iterations], ["Estado", M.converged ? "convergió" : "sin converger"], ["Tolerancia", fmt.sci(M.tolerance)],
    ["Inercia final", fmt.num(M.final_inertia)], ["Semilla", M.seed]]) +
  `<div class="idx-title">Análisis</div>` + rows([["Submuestra", fmt.int(M.subsample)], ["Puntos t-SNE", fmt.int(M.projected)],
    ["Palabras vacías", D.sizes.filter(v => v === 0).length]]) +
  `<div class="idx-title">Fuente</div><div class="ruta">${esc(M.dataset)}</div><div class="ruta">${esc(M.run)}</div>` +
  `<div class="ruta">generado ${esc(M.generated.replace("T", " ").replace("+00:00", " UTC"))}</div>` +
  `<div class="idx-title">Palabras resaltadas</div><div id="leyenda" role="group" aria-label="Resaltar una palabra"></div>`;
function legend() {
  const box = $("leyenda"); box.innerHTML = "";
  top.forEach((c, s) => {
    const b = el("button", { type: "button", className: "tree-head" },
      `<span class="node-icon" style="background:${C.series[s]}"></span>cluster ${c}<span class="pct">${fmt.pct(D.sizes[c] / total)}</span>`);
    b.setAttribute("aria-pressed", String(state.locked === s));
    const set = v => { state.hl = v; drawPlayer(); };
    b.addEventListener("pointerenter", () => set(s)); b.addEventListener("pointerleave", () => set(state.locked));
    b.addEventListener("focus", () => set(s)); b.addEventListener("blur", () => set(state.locked));
    b.addEventListener("click", () => { state.locked = state.locked === s ? null : s; legend(); set(state.locked); });
    box.append(b);
  });
  box.append(el("div", { className: "col-row muted" }, `<span><span class="node-icon" style="background:${C.other};margin-right:6px"></span>otras ${K - top.length}</span>`));
}
legend();

/* ---------- gráfico de líneas ---------- */
function axisStyle(g) {
  g.selectAll("text").attr("fill", C.muted).style("font", "10px Consolas, 'Courier New', monospace");
}
function lineChart(host, o) {
  const draw = () => {
    host.innerHTML = "";
    const w = host.clientWidth - 8 || 260, h = o.height || 150, m = { t: 8, r: 12, b: 22, l: 46 };
    const pts = o.xs.map((x, i) => [x, o.ys[i]]);
    const x = d3.scaleLinear(o.xs.length > 1 ? d3.extent(o.xs) : [o.xs[0] - 1, o.xs[0] + 1], [m.l, w - m.r]);
    let dom = d3.extent(o.ref ? o.ys.concat([o.ref.value]) : o.ys);
    const y = o.scale === "log" ? d3.scaleLog() : o.scale === "symlog" ? d3.scaleSymlog().constant(o.constant || 1) : d3.scaleLinear();
    if (o.scale !== "log") dom = [0, Math.max(dom[1], 1)];
    y.domain(dom).range([h - m.b, m.t]);
    if (o.scale !== "log") y.nice(4);
    let ticks = y.ticks(4);
    if (o.scale === "log" && ticks.length > 5) ticks = ticks.filter((_, i) => i % Math.ceil(ticks.length / 4) === 0);
    if (o.integer) ticks = ticks.filter(Number.isInteger);
    ticks = ticks.filter((v, i, a) => i === 0 || Math.abs(y(v) - y(a[i - 1])) >= 14);   // symlog/log agrupan marcas arriba
    const svg = d3.select(host).append("svg").attr("width", w).attr("height", h).attr("role", "img").attr("aria-label", o.label);
    svg.append("g").selectAll("line").data(ticks).join("line").attr("x1", m.l).attr("x2", w - m.r).attr("y1", y).attr("y2", y).attr("stroke", C.grid);
    svg.append("g").attr("transform", `translate(${m.l},0)`)
      .call(d3.axisLeft(y).tickValues(ticks).tickFormat(o.yFmt).tickSize(0).tickPadding(5))
      .call(g => g.select(".domain").remove()).call(axisStyle);
    svg.append("g").attr("transform", `translate(0,${h - m.b})`)
      .call(d3.axisBottom(x).ticks(Math.min(6, o.xs.length)).tickFormat(d3.format("~d")).tickSizeOuter(0))
      .call(g => g.selectAll(".domain, .tick line").attr("stroke", C.muted)).call(axisStyle);
    if (o.ref) {
      svg.append("line").attr("x1", m.l).attr("x2", w - m.r).attr("y1", y(o.ref.value)).attr("y2", y(o.ref.value))
        .attr("stroke", C.muted).attr("stroke-dasharray", "4 3");
      svg.append("text").attr("x", w - m.r).attr("y", y(o.ref.value) - 4).attr("text-anchor", "end")
        .attr("fill", C.muted).style("font-size", "10px").text(o.ref.label);
    }
    const rule = svg.append("line").attr("y1", m.t).attr("y2", h - m.b).attr("stroke", "#d54a14").attr("stroke-width", 1.5);
    const line = (o.step ? d3.line().curve(d3.curveStepAfter) : d3.line()).x(d => x(d[0])).y(d => y(d[1]));
    svg.append("path").datum(pts).attr("fill", "none").attr("stroke", C.accent).attr("stroke-width", 2).attr("stroke-linejoin", "round").attr("d", line);
    const last = pts[pts.length - 1];
    svg.append("circle").attr("cx", x(last[0])).attr("cy", y(last[1])).attr("r", 3.5).attr("fill", C.accent).attr("stroke", C.panel).attr("stroke-width", 2);
    const focus = svg.append("circle").attr("r", 4).attr("fill", C.accent).attr("stroke", C.panel).attr("stroke-width", 2).attr("visibility", "hidden");
    host._sync = () => {
      const inside = o.rule !== false && state.t >= x.domain()[0] && state.t <= x.domain()[1];
      rule.attr("visibility", inside ? "visible" : "hidden").attr("x1", x(state.t)).attr("x2", x(state.t));
    };
    host._sync();
    const nearest = ev => { const xv = x.invert(d3.pointer(ev, svg.node())[0]); return d3.minIndex(o.xs, v => Math.abs(v - xv)); };
    svg.append("rect").attr("x", m.l).attr("y", m.t).attr("width", Math.max(0, w - m.l - m.r)).attr("height", h - m.t - m.b)
      .attr("fill", "transparent").style("cursor", o.rule === false ? "crosshair" : "pointer")
      .on("pointermove", ev => { const i = nearest(ev); focus.attr("visibility", "visible").attr("cx", x(o.xs[i])).attr("cy", y(o.ys[i])); showTip(o.tip(i), ev); })
      .on("pointerleave", () => { focus.attr("visibility", "hidden"); hideTip(); })
      .on("click", ev => { if (o.rule !== false) setT(o.xs[nearest(ev)]); });
  };
  draw();
  if (o.rule !== false) onT.push(() => host._sync());
  return draw;
}

/* ---------- convergencia ---------- */
const its = hist.map(h => h.iteration), curvas = $("curvas");
redraws.push(
  lineChart(figure(curvas, "Inercia"), { xs: its, ys: hist.map(h => h.inertia), scale: "log", yFmt: d3.format(".2~s"), label: "Inercia por iteración",
    tip: i => `<b>${iterName(its[i])}</b><br>inercia ${fmt.num(hist[i].inertia)}` + (i ? `<br>${fmt.pct2(1 - hist[i].inertia / hist[i - 1].inertia)} menos que la anterior` : "") }),
  lineChart(figure(curvas, "Desplazamiento máximo"), { xs: its, ys: hist.map(h => Math.max(h.movement, 1e-12)), scale: "log", yFmt: d3.format(".0e"),
    ref: { value: M.tolerance, label: "tolerancia" }, label: "Mayor desplazamiento de un centroide",
    tip: i => `<b>${iterName(its[i])}</b><br>desplazamiento ${fmt.sci(hist[i].movement)}<br>tolerancia ${fmt.sci(M.tolerance)}` }),
  lineChart(figure(curvas, "Churn (% que cambia de cluster)"), { xs: its, ys: D.churn.map(v => 100 * v), scale: "symlog", constant: 0.1,
    yFmt: d => `${d3.format("~g")(d)}%`, label: "Porcentaje de descriptores que cambian de cluster",
    tip: i => `<b>${iterName(its[i])}</b><br>${fmt.pct2(D.churn[i])} de los descriptores cambió de cluster` }),
  lineChart(figure(curvas, "Grupos vacíos"), { xs: its, ys: hist.map(h => h.empty), step: true, integer: true, yFmt: d3.format("~d"),
    label: "Clusters sin descriptores", tip: i => `<b>${iterName(its[i])}</b><br>${hist[i].empty} grupos vacíos` })
);

/* ---------- reproductor ---------- */
const range = $("iteracion"), play = $("play"), readout = $("readout");
range.max = T - 1; range.value = state.t;
$("pca-titulo").textContent = `Trayectorias en PCA, ${fmt.pct(D.pca.evr[0])} + ${fmt.pct(D.pca.evr[1])} de la varianza (Rauber T2)`;
$("estado").textContent = `t-SNE se calculó una vez sobre ${fmt.int(N)} descriptores: solo cambia el color, que sigue al centroide asignado. ` +
  "En PCA, círculo = posición inicial y punto relleno = posición en la iteración elegida. " +
  "En ambos: rueda o pellizco para acercar, arrastrar para mover, doble clic para volver.";

function canvasIn(host, size) {
  let c = host.querySelector("canvas");
  if (!c) { c = el("canvas"); c.setAttribute("role", "img"); host.append(c); }
  const dpr = window.devicePixelRatio || 1;
  c.width = size * dpr; c.height = size * dpr; c.style.width = `${size}px`; c.style.height = `${size}px`;
  const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, size, size);
  return [c, ctx];
}
const sizeOf = host => Math.max(200, Math.min((host.clientWidth || 300) - 8, 480));
function fitScale(xs, ys, size) {
  const pad = 10, [x0, x1] = d3.extent(xs), [y0, y1] = d3.extent(ys), span = Math.max(x1 - x0, y1 - y0) || 1;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, k = (size - 2 * pad) / span;
  return [v => size / 2 + (v - cx) * k, v => size / 2 - (v - cy) * k];
}
// Zoom propio de cada lienzo (d3 lo guarda en el nodo); los puntos conservan su tamaño en píxeles.
function zoomable(c, size, redraw) {
  if (c._size !== size) { c.__zoom = d3.zoomIdentity; c._size = size; }   // la escala cambió: un zoom viejo ya no corresponde
  if (!c._zoom) {
    c._zoom = d3.zoom().scaleExtent([1, 60]).on("zoom", () => { hideTip(); redraw(); });
    d3.select(c).call(c._zoom).on("dblclick.zoom", () => d3.select(c).transition().duration(250).call(c._zoom.transform, d3.zoomIdentity));
  }
  c._zoom.extent([[0, 0], [size, size]]).translateExtent([[0, 0], [size, size]]);
  return d3.zoomTransform(c);
}
function dots(ctx, xs, ys, keep, r) {
  ctx.beginPath();
  for (let i = 0; i < xs.length; i++) if (keep(i)) { ctx.moveTo(xs[i] + r, ys[i]); ctx.arc(xs[i], ys[i], r, 0, 2 * Math.PI); }
  ctx.fill();
}

const tsneHost = $("tsne");
let tsne = null;
function drawTsne() {
  const size = sizeOf(tsneHost), [c, ctx] = canvasIn(tsneHost, size);
  c.setAttribute("aria-label", `Proyección t-SNE coloreada por cluster en ${iterName(state.t)}`);
  if (!tsne || tsne.size !== size) {
    const [sx, sy] = fitScale(P.x, P.y, size), px = P.x.map(sx), py = P.y.map(sy);
    tsne = { size, px, py, del: d3.Delaunay.from(px.map((x, i) => [x, py[i]])) };
  }
  const z = zoomable(c, size, drawTsne), px = tsne.px.map(v => z.applyX(v)), py = tsne.py.map(v => z.applyY(v));
  const codes = P.slots[state.t], dim = state.hl !== null;
  ctx.globalAlpha = dim ? 0.3 : 0.8; ctx.fillStyle = C.other;
  dots(ctx, px, py, i => codes[i] === ".", 1.3);
  top.forEach((_, s) => {
    const ch = String(s);
    ctx.globalAlpha = dim && state.hl !== s ? 0.15 : 0.9; ctx.fillStyle = C.series[s];
    dots(ctx, px, py, i => codes[i] === ch, 1.8);
  });
  ctx.globalAlpha = 1;
  c.onpointermove = ev => {
    const r = c.getBoundingClientRect(), i = tsne.del.find(z.invertX(ev.clientX - r.left), z.invertY(ev.clientY - r.top)), ch = P.slots[state.t][i];
    const g = D.genres && D.genres.proj[i] !== "." ? `<br>género: ${esc(D.genres.names[+D.genres.proj[i]])}` : "";
    showTip(`<b>${iterName(state.t)}</b>: ${ch === "." ? "una palabra fuera de las 8 resaltadas" : `cluster ${top[+ch]}`}<br>al final: cluster ${P.final[i]}${g}`, ev);
  };
  c.onpointerleave = hideTip;
}

const pcaHost = $("pca"), TR = D.pca.traj, bg = D.pca.bg;
let pcaView = null;
function drawPca() {
  const size = sizeOf(pcaHost), [c, ctx] = canvasIn(pcaHost, size), t = state.t, dim = state.hl !== null;
  c.setAttribute("aria-label", `Trayectorias de los centroides hasta ${iterName(t)}`);
  if (!pcaView || pcaView.size !== size) {
    const xs = bg.map(d => d[0]), ys = bg.map(d => d[1]);
    TR.forEach(a => { for (let i = 0; i < a.length; i += 2) { xs.push(a[i]); ys.push(a[i + 1]); } });
    const [sx, sy] = fitScale(xs, ys, size);
    pcaView = { size, sx, sy };
  }
  const z = zoomable(c, size, drawPca), sx = v => z.applyX(pcaView.sx(v)), sy = v => z.applyY(pcaView.sy(v));
  ctx.globalAlpha = 0.5; ctx.fillStyle = C.other;
  bg.forEach(d => ctx.fillRect(sx(d[0]) - 0.7, sy(d[1]) - 0.7, 1.4, 1.4));
  const path = a => { ctx.beginPath(); ctx.moveTo(sx(a[0]), sy(a[1])); for (let i = 1; i <= t; i++) ctx.lineTo(sx(a[2 * i]), sy(a[2 * i + 1])); ctx.stroke(); };
  ctx.lineWidth = 0.8; ctx.strokeStyle = C.muted; ctx.globalAlpha = dim ? 0.12 : 0.35;
  TR.forEach((a, cl) => { if (!slotOf.has(cl)) path(a); });
  ctx.fillStyle = C.muted;
  TR.forEach((a, cl) => { if (!slotOf.has(cl)) { ctx.beginPath(); ctx.arc(sx(a[2 * t]), sy(a[2 * t + 1]), 1.8, 0, 2 * Math.PI); ctx.fill(); } });
  top.forEach((cl, s) => {
    const a = TR[cl];
    ctx.globalAlpha = !dim || state.hl === s ? 1 : 0.2; ctx.strokeStyle = C.series[s]; ctx.lineWidth = 2; ctx.lineJoin = "round"; path(a);
    ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(sx(a[0]), sy(a[1]), 4, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(sx(a[2 * t]), sy(a[2 * t + 1]), 5, 0, 2 * Math.PI);
    ctx.fillStyle = C.series[s]; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.panel; ctx.stroke();
  });
  ctx.globalAlpha = 1;
  const del = d3.Delaunay.from(TR.map(a => [sx(a[2 * t]), sy(a[2 * t + 1])]));
  c.onpointermove = ev => {
    const r = c.getBoundingClientRect(), k = del.find(ev.clientX - r.left, ev.clientY - r.top);
    showTip(`<b>cluster ${k}</b> en ${iterName(t)}<br>${fmt.int(D.sizes[k])} descriptores al final<br>` +
      `recorrido total ${fmt.num(D.pca.path[k])}<br>desplazamiento neto ${fmt.num(D.pca.net[k])}`, ev);
  };
  c.onpointerleave = hideTip;
}
function drawReadout() {
  const t = state.t;
  readout.textContent = t === 0 ? "K-Means++ · centros iniciales" :
    `${iterName(t)}/${T - 1} · inercia ${fmt.num(hist[t - 1].inertia)} · churn ${fmt.pct2(D.churn[t - 1])} · desplazamiento ${fmt.sci(hist[t - 1].movement)}`;
}
function drawPlayer() { drawTsne(); drawPca(); }
function setT(t) { state.t = Math.max(0, Math.min(T - 1, t)); range.value = state.t; drawReadout(); drawPlayer(); onT.forEach(f => f()); }
let timer = null;
function stop() { if (timer) { timer.stop(); timer = null; play.textContent = "▶ Reproducir"; } }
range.addEventListener("input", () => { stop(); setT(+range.value); });
play.addEventListener("click", () => {
  if (timer) return stop();
  if (state.t >= T - 1) setT(0);
  play.textContent = "❚❚ Pausar";
  timer = d3.interval(() => { if (state.t >= T - 1) stop(); else setT(state.t + 1); }, Math.max(80, 4000 / T));
});
drawReadout(); drawPlayer();
redraws.push(() => { tsne = null; pcaView = null; drawPlayer(); });

/* ---------- pestañas ---------- */
const READ = {
  tamanos: "<p>A la izquierda, cuántos descriptores cayeron en cada palabra, de la más grande a la más chica. Las palabras muy grandes " +
    "discriminan poco y el IDF las castiga; una caída brusca separa palabras genéricas de palabras específicas.</p>" +
    "<p>A la derecha, la distancia de cada centroide a su vecino más cercano. Los pares muy cercanos de la tabla son candidatos a " +
    "palabras redundantes: un K menor podría bastar.</p>",
  sustituto: "<p>Un árbol de profundidad 4 aprende a imitar la asignación del K-Means: las 8 palabras resaltadas contra «otras» (-1). " +
    "Se evalúa con datos que no vio.</p><p>Como «otras» domina, la medida es la <b>exactitud balanceada</b> (recall promedio por " +
    "clase), no la simple. Si queda cerca del azar, las reglas no explican nada. Si es alta, las reglas dicen qué coeficientes " +
    "definen cada palabra.</p>",
  generos: D.genres
    ? "<p>Cada descriptor hereda el género de su canción. La pureza de una palabra es la fracción de sus descriptores que pertenece " +
      "a su género mayoritario.</p><p>Una palabra acústica dura 23 ms, así que no se espera pureza alta: interesa comparar la pureza " +
      "media con la línea base y ver qué palabras son características de un género.</p>"
    : "<p>Esta pestaña necesita <span class=\"mono\">sample-files.npy</span> en el entrenamiento y <span class=\"mono\">tracks.csv</span> de " +
      "<span class=\"mono\">fma_metadata.zip</span>. Vuelve a generar la página con <span class=\"mono\">--tracks</span>.</p>",
};
const drawn = {}, TABS = {};
function showTab(name) {
  state.tab = name;
  document.querySelectorAll(".tab").forEach(b => { const on = b.dataset.tab === name; b.classList.toggle("active", on); b.setAttribute("aria-selected", on); });
  Object.keys(READ).forEach(k => { $(`tab-${k}`).hidden = k !== name; });
  $("lectura").innerHTML = READ[name];
  if (!drawn[name]) { drawn[name] = true; TABS[name]($(`tab-${name}`).querySelector(".panel-body")); }
  else (TABS[name].redraw || []).forEach(f => f());
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
const table = (head, body) => `<div class="tabla"><table class="grid-table"><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;

TABS.tamanos = body => {
  const pair = el("div", { className: "pareja" }); body.append(pair);
  const order = d3.range(K).sort((a, b) => D.sizes[b] - D.sizes[a]);
  const rank = lineChart(figure(pair, "Descriptores por palabra (ordenado)"), { xs: order.map((_, i) => i + 1), ys: order.map(c => Math.max(1, D.sizes[c])),
    scale: "log", yFmt: d3.format("~s"), rule: false, height: 200, label: "Tamaño de cada palabra ordenado por rango",
    tip: i => `<b>rango ${i + 1}</b>: cluster ${order[i]}<br>${fmt.int(D.sizes[order[i]])} descriptores (${fmt.pct(D.sizes[order[i]] / total)})` });
  const hHost = figure(pair, "Distancia al centroide más cercano");
  const drawHist = () => {
    hHost.innerHTML = "";
    const w = hHost.clientWidth - 8 || 260, h = 200, m = { t: 8, r: 12, b: 22, l: 36 };
    const bins = d3.bin().thresholds(24)(D.nearest);
    const x = d3.scaleLinear([bins[0].x0, bins[bins.length - 1].x1], [m.l, w - m.r]);
    const y = d3.scaleLinear([0, d3.max(bins, b => b.length)], [h - m.b, m.t]).nice(4);
    const svg = d3.select(hHost).append("svg").attr("width", w).attr("height", h).attr("role", "img").attr("aria-label", "Histograma de distancias al centroide más cercano");
    const yt = y.ticks(4).filter(Number.isInteger);
    svg.append("g").selectAll("line").data(yt).join("line").attr("x1", m.l).attr("x2", w - m.r).attr("y1", y).attr("y2", y).attr("stroke", C.grid);
    svg.append("g").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).tickValues(yt).tickFormat(d3.format("~d")).tickSize(0).tickPadding(5))
      .call(g => g.select(".domain").remove()).call(axisStyle);
    svg.append("g").attr("transform", `translate(0,${h - m.b})`).call(d3.axisBottom(x).ticks(5).tickSizeOuter(0))
      .call(g => g.selectAll(".domain, .tick line").attr("stroke", C.muted)).call(axisStyle);
    svg.append("g").selectAll("rect").data(bins).join("rect")
      .attr("x", b => x(b.x0) + 1).attr("width", b => Math.max(0, x(b.x1) - x(b.x0) - 2))
      .attr("y", b => y(b.length)).attr("height", b => y(0) - y(b.length)).attr("fill", C.accent)
      .on("pointermove", (ev, b) => showTip(`<b>${fmt.f2(b.x0)} – ${fmt.f2(b.x1)}</b><br>${b.length} palabras`, ev)).on("pointerleave", hideTip);
  };
  drawHist();
  body.append(el("div", { className: "idx-title" }, "Pares de centroides más cercanos"));
  body.insertAdjacentHTML("beforeend", table(["Palabras", "Distancia", "Tamaños"], D.pairs.map(([a, b, d]) =>
    `<tr><td>${a} · ${b}</td><td>${fmt.num(d)}</td><td>${fmt.int(D.sizes[a])} · ${fmt.int(D.sizes[b])}</td></tr>`).join("")));
  body.append(el("div", { className: "muted", style: "margin-top:4px" },
    `Las 10 palabras más grandes cubren ${fmt.pct(d3.sum(order.slice(0, 10), c => D.sizes[c]) / total)} de la muestra.`));
  TABS.tamanos.redraw = [rank, drawHist];
};

TABS.sustituto = body => {
  const S = D.surrogate, pair = el("div", { className: "pareja" }); body.append(pair);
  const left = el("div");
  left.innerHTML = `<div class="idx-title">Fidelidad en datos no vistos</div>` + table(["Medida", "Valor"],
    [["Exactitud balanceada", S.balanced], ["Azar (9 clases)", S.chance], ["Exactitud simple", S.accuracy]]
      .map(([k, v]) => `<tr><td class="txt">${k}</td><td>${fmt.pct(v)}</td></tr>`).join("")) +
    `<div class="idx-title">Recall por palabra</div>` + table(["Palabra", "Recall", ""], top.map((c, s) =>
      `<tr><td class="txt"><span class="node-icon" style="background:${C.series[s]};margin-right:6px"></span>cluster ${c}</td><td>${fmt.pct(S.recall[s])}</td>` +
      `<td style="width:50%"><div class="ex-bar"><div style="width:${100 * S.recall[s]}%;background:${C.series[s]}"></div></div></td></tr>`).join(""));
  const right = el("div");
  right.append(el("div", { className: "idx-title" }, "Reglas del árbol"), el("pre", { className: "ex-text" }, esc(S.rules)));
  pair.append(left, right);
};

TABS.generos = body => {
  const G = D.genres;
  if (!G) { body.innerHTML = '<p class="muted">Sin datos de géneros. Lee el panel de la derecha.</p>'; return; }
  body.insertAdjacentHTML("beforeend", table(["Medida", "Valor"],
    `<tr><td class="txt">Pureza media ponderada</td><td>${fmt.pct(G.purity)}</td></tr>` +
    `<tr><td class="txt">Línea base (si las palabras ignoraran el género)</td><td>${fmt.pct(G.baseline)}</td></tr>`));
  const pair = el("div", { className: "pareja", style: "margin-top:8px" }); body.append(pair);
  const gHost = figure(pair, "La misma proyección t-SNE, por género");
  const drawGenres = () => {
    const size = sizeOf(gHost), [c, ctx] = canvasIn(gHost, size), [sx, sy] = fitScale(P.x, P.y, size);
    c.setAttribute("aria-label", "Proyección t-SNE coloreada por género");
    const px = P.x.map(sx), py = P.y.map(sy);
    ctx.globalAlpha = 0.85;
    G.names.forEach((_, gi) => { ctx.fillStyle = C.series[gi]; dots(ctx, px, py, i => G.proj[i] === String(gi), 1.8); });
    let key = gHost.querySelector(".clave");
    if (!key) { key = el("div", { className: "clave", style: "display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px" }); gHost.append(key); }
    key.innerHTML = G.names.map((n, gi) => `<span><span class="node-icon" style="background:${C.series[gi]};margin-right:4px"></span>${esc(n)}</span>`).join("");
  };
  drawGenres();
  const hHost = figure(pair, "Reparto por género de las 30 palabras más grandes");
  const drawHeat = () => {
    hHost.innerHTML = "";
    const H = G.heat, w = hHost.clientWidth - 8 || 260, m = { t: 4, r: 6, b: 64, l: 66 }, h = m.t + m.b + 13 * H.clusters.length;
    const x = d3.scaleBand(G.names, [m.l, w - m.r]).padding(0.05), y = d3.scaleBand(H.clusters, [m.t, h - m.b]).padding(0.08);
    const fill = d3.interpolateRgb(C.panel, C.accent);
    const svg = d3.select(hHost).append("svg").attr("width", w).attr("height", h).attr("role", "img").attr("aria-label", "Fracción de cada palabra por género");
    H.clusters.forEach((cl, r) => G.names.forEach((g, gi) => svg.append("rect").attr("x", x(g)).attr("y", y(cl))
      .attr("width", x.bandwidth()).attr("height", y.bandwidth()).attr("fill", fill(H.shares[r][gi])).attr("stroke", C.grid)
      .on("pointermove", ev => showTip(`<b>cluster ${cl}</b> · ${esc(g)}<br>${fmt.pct(H.shares[r][gi])} de sus descriptores`, ev))
      .on("pointerleave", hideTip)));
    svg.append("g").attr("transform", `translate(${m.l},0)`).call(d3.axisLeft(y).tickFormat(c => `cluster ${c}`).tickSize(0).tickPadding(4))
      .call(g => g.select(".domain").remove()).call(axisStyle);
    svg.append("g").attr("transform", `translate(0,${h - m.b})`).call(d3.axisBottom(x).tickSize(0).tickPadding(4))
      .call(g => g.select(".domain").remove()).call(axisStyle)
      .call(g => g.selectAll("text").attr("text-anchor", "end").attr("transform", "rotate(-40)").attr("dx", "-0.3em").attr("dy", "0.3em"));
  };
  drawHeat();
  body.append(el("div", { className: "idx-title" }, "Palabras más puras (al menos 50 descriptores)"));
  body.insertAdjacentHTML("beforeend", table(["Palabra", "Pureza", "Género"], G.pure.map(([c, p, g]) =>
    `<tr><td>cluster ${c}</td><td>${fmt.pct(p)}</td><td class="txt">${esc(g)}</td></tr>`).join("")));
  TABS.generos.redraw = [drawGenres, drawHeat];
};
showTab("tamanos");

/* ---------- tamaño de ventana ---------- */
let lastW = innerWidth, pending = null;
addEventListener("resize", () => {
  if (innerWidth === lastW) return;
  lastW = innerWidth; cancelAnimationFrame(pending);
  pending = requestAnimationFrame(() => { redraws.forEach(f => f()); (TABS[state.tab].redraw || []).forEach(f => f()); });
});
})();
</script>
</body>
</html>
