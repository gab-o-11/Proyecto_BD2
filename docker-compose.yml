services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - runtime:/app/data/runtime
      - ./data/demo:/app/data/demo
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  runtime:
