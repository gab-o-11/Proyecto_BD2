services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - runtime:/app/data/runtime
      - ./data/demo:/app/data/demo
      - ./data/multimedia:/app/data/multimedia:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"  # sin login y con /api/reset: solo esta máquina
    depends_on:
      - backend
    restart: unless-stopped

  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    profiles: ["rag"]
    environment:
      BD2_URL: http://backend:8000
    env_file:
      - path: rag/.env
        required: false
    volumes:
      - ./data/rag:/app/data/rag
      - hf_cache:/cache/hf
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  runtime:
  hf_cache:
